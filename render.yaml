services:
  - type: web
    name: smarttravel-backend
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --prefix backend && npm run build --prefix frontend
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NOMINATIM_BASE_URL
        value: https://nominatim.openstreetmap.org
      - key: NOMINATIM_TIMEOUT_MS
        value: "8000"
      - key: NOMINATIM_USER_AGENT
        value: SmartTravelApp/1.0 (https://github.com/IrfanAnsari1212/smartTravel)
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: OSRM_TIMEOUT_MS
        value: "8000"
      - key: OVERPASS_URL
        value: https://overpass-api.de/api/interpreter
      - key: OVERPASS_TIMEOUT_MS
        value: "15000"
